name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and validate artifacts only (skip GitHub Release publish)'
        required: true
        type: boolean
        default: true
      tag_name:
        description: 'Tag name to use when publishing from manual trigger (optional)'
        required: false
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── macOS Universal Binary (arm64 + x86_64 → single fat binary) ───────────
  build-macos:
    name: Build macOS Universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/cli/target
          key: macos-universal-cargo-${{ hashFiles('packages/cli/Cargo.lock') }}
          restore-keys: macos-universal-cargo-

      - name: Build arm64
        run: cargo build --release --manifest-path packages/cli/Cargo.toml --target aarch64-apple-darwin

      - name: Build x86_64
        run: cargo build --release --manifest-path packages/cli/Cargo.toml --target x86_64-apple-darwin

      - name: Create Universal Binary
        run: |
          lipo -create \
            packages/cli/target/aarch64-apple-darwin/release/cb \
            packages/cli/target/x86_64-apple-darwin/release/cb \
            -output cb-macos-universal
          strip cb-macos-universal
          file cb-macos-universal

      - name: Codesign & Notarize
        if: ${{ env.APPLE_CERTIFICATE != '' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        run: |
          # ── Import certificate into temporary keychain ──
          KEYCHAIN="build.keychain"
          KEYCHAIN_PW="actions"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE" | base64 --decode > cert.p12
          security import cert.p12 -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          rm cert.p12

          # ── Sign with entitlements ──
          codesign --force --options runtime \
            --entitlements packages/cli/entitlements.plist \
            --sign "Developer ID Application: ${APPLE_TEAM_ID}" \
            --timestamp \
            cb-macos-universal

          codesign --verify --verbose cb-macos-universal

          # ── Notarize ──
          zip cb-notarize.zip cb-macos-universal
          xcrun notarytool submit cb-notarize.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 600
          rm cb-notarize.zip

          echo "✓ Signed and notarized"

      - name: Ad-hoc sign (no Apple credentials)
        if: ${{ env.APPLE_CERTIFICATE == '' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          codesign --force \
            --entitlements packages/cli/entitlements.plist \
            --sign - \
            cb-macos-universal
          echo "⚠ Ad-hoc signed only (no Apple Developer credentials configured)"

      - uses: actions/upload-artifact@v6
        with:
          name: cb-macos-universal
          path: cb-macos-universal

  # ── Linux x86_64 ──────────────────────────────────────────────────────────
  build-linux-x86:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/cli/target
          key: linux-x86-cargo-${{ hashFiles('packages/cli/Cargo.lock') }}
          restore-keys: linux-x86-cargo-

      - name: Install ALSA dev
        run: sudo apt-get install -y libasound2-dev

      - name: Build
        run: cargo build --release --manifest-path packages/cli/Cargo.toml --target x86_64-unknown-linux-gnu

      - name: Package
        run: |
          cp packages/cli/target/x86_64-unknown-linux-gnu/release/cb cb-linux-x86_64
          strip cb-linux-x86_64

      - uses: actions/upload-artifact@v6
        with:
          name: cb-linux-x86_64
          path: cb-linux-x86_64

  # ── Linux aarch64 (native ARM runner) ──────────────────────────────────────
  build-linux-arm:
    name: Build Linux aarch64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/cli/target
          key: linux-arm-native-cargo-${{ hashFiles('packages/cli/Cargo.lock') }}
          restore-keys: linux-arm-native-cargo-

      - name: Install ALSA dev
        run: sudo apt-get install -y libasound2-dev

      - name: Build
        run: cargo build --release --manifest-path packages/cli/Cargo.toml

      - name: Package
        run: |
          cp packages/cli/target/release/cb cb-linux-arm64
          strip cb-linux-arm64

      - uses: actions/upload-artifact@v6
        with:
          name: cb-linux-arm64
          path: cb-linux-arm64

  # ── Package + (optionally) Create GitHub Release ──────────────────────────
  release:
    name: Package / Release
    needs: [build-macos, build-linux-x86, build-linux-arm]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      should_publish: ${{ steps.meta.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: Compute checksums
        run: |
          cd artifacts
          for dir in */; do
            file="${dir%/}"
            sha256sum "$file/$file" > "$file/$file.sha256"
          done

      - name: Resolve release tag
        id: meta
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            tag="${GITHUB_REF_NAME}"
            should_publish=true
          elif [[ -n "${{ inputs.tag_name }}" ]]; then
            tag="${{ inputs.tag_name }}"
            should_publish=${{ !inputs.dry_run }}
          else
            tag="manual-${GITHUB_RUN_NUMBER}"
            should_publish=${{ !inputs.dry_run }}
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "should_publish=${should_publish}" >> "$GITHUB_OUTPUT"
          echo "resolved tag: ${tag} (publish: ${should_publish})"

      - name: Dry-run summary
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          echo "Dry run complete. Built artifacts:"
          find artifacts -maxdepth 2 -type f -print | sort

      - name: Upload dry-run bundle
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        uses: actions/upload-artifact@v6
        with:
          name: release-dry-run-${{ steps.meta.outputs.tag }}
          path: artifacts

      - name: Create release
        if: ${{ steps.meta.outputs.should_publish == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          # Mark pre-release when the tag carries a semver pre-release suffix
          # (anything after a hyphen: -beta, -rc, -alpha, -manual, …).
          prerelease: ${{ contains(steps.meta.outputs.tag, '-') }}
          files: |
            artifacts/cb-macos-universal/cb-macos-universal
            artifacts/cb-macos-universal/cb-macos-universal.sha256
            artifacts/cb-linux-x86_64/cb-linux-x86_64
            artifacts/cb-linux-x86_64/cb-linux-x86_64.sha256
            artifacts/cb-linux-arm64/cb-linux-arm64
            artifacts/cb-linux-arm64/cb-linux-arm64.sha256

  # ── 通知 homebrew-tap（仅正式版）：它会立刻 bump brew formula 并同步 npm 包 ─────
  #    brew / npm 两个渠道都由 homebrew-tap 这个 hub 自动跟正式版，本仓库不持有 npm 凭证。
  #    需要仓库 secret TAP_DISPATCH_TOKEN：对 Erchoc/homebrew-tap 有 contents:write
  #    的 fine-grained PAT。没配也没关系，tap 的定时任务（北京时间每天 08:10 / 20:10）会自动跟上。
  notify-tap:
    name: Notify homebrew-tap
    needs: release
    if: ${{ needs.release.outputs.should_publish == 'true' && !contains(needs.release.outputs.tag, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: repository_dispatch → Erchoc/homebrew-tap
        env:
          GH_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::TAP_DISPATCH_TOKEN 未配置，跳过即时通知；homebrew-tap 的定时任务会在下一个检查点（北京时间 08:10 / 20:10）自动同步 brew 与 npm。"
            exit 0
          fi
          printf '{"event_type":"release-published","client_payload":{"tool":"cb","tag":"%s"}}' "$TAG" \
            | gh api repos/Erchoc/homebrew-tap/dispatches --input -
          echo "✓ dispatched release-published(cb, $TAG) to Erchoc/homebrew-tap"
